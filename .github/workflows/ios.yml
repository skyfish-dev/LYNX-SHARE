name: iOS

# Builds an unsigned .ipa for iPhone/iPad on a macOS runner. Install it with AltStore, Sideloadly or Xcode
# (see docs/IOS.md). No Apple Developer account is needed to build; signing happens when you install.

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "src/ios/**"
      - "CMakeLists.txt"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "src/ios/**"
      - "CMakeLists.txt"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    name: Build LYNX SHARE (unsigned .ipa)
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cmake --version
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Configure (iOS arm64)
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLYNX_LTO=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            "-DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target LynxIOS -- -sdk iphoneos -quiet

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          # JUCE's artefacts folder and the plain Xcode layout are both searched
          APP=$(find build-ios -type d -name "LYNX.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then
            APP=$(find build-ios -type d -name "LYNX.app" | head -n 1)
          fi
          if [ -z "$APP" ]; then
            echo "LYNX.app was not produced; build products:"
            find build-ios -name "*.app" | head -n 20
            exit 1
          fi
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          rm -rf Payload LYNX-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LYNX-unsigned.ipa Payload
          ls -lh LYNX-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LYNX-unsigned-ipa
          path: LYNX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # The .ipa cannot be run on the runner, so the same build is launched in the Simulator: it catches a crash or an
  # empty window before the app reaches a device. The screenshot is kept as an artifact.
  simulator:
    name: Simulator smoke test
    runs-on: macos-15
    timeout-minutes: 120
    needs: ipa

    steps:
      - uses: actions/checkout@v4

      - name: Configure (iOS Simulator arm64)
        run: |
          cmake -S . -B build-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLYNX_LTO=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-sim --config Release --target LynxIOS -- -sdk iphonesimulator -quiet

      - name: Boot a simulator, install and launch LYNX
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load (sys.stdin)["devices"]
          for runtime in sorted (devices):
              for device in devices[runtime]:
                  if device["name"].startswith ("iPhone"):
                      print (device["udid"])
                      raise SystemExit
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build-sim -type d -name "LYNX.app" | head -n 1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.ka1-s.lynx.ios
          sleep 12
          xcrun simctl io "$UDID" screenshot lynx-screen.png
          # the app must still be running: a crash would remove it from launchd's list
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "com.ka1-s.lynx.ios"; then
            echo "LYNX is no longer running"
            exit 1
          fi
          echo "LYNX is running"

      - name: Crash logs
        if: failure()
        run: |
          ls -lt ~/Library/Logs/DiagnosticReports | head -n 20 || true
          find ~/Library/Logs/DiagnosticReports -name "LYNX*" -newermt "-30 minutes" -exec cat {} \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LYNX-simulator-screenshot
          path: lynx-screen.png
          if-no-files-found: warn
          retention-days: 30
